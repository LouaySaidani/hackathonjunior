      <stop offset="1" stop-color="#2B7FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD48A"/>
      <stop offset="0.5" stop-color="#F2A541"/>
      <stop offset="1" stop-color="#E8743B"/>
    </linearGradient>
