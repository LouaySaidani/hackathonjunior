<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="392" viewBox="0 0 1280 392" role="img" aria-labelledby="title desc">
  <title id="title">Une description par silence</title>
  <desc id="desc">Frise : trois silences entre les dialogues, chacun reçoit une ligne d’audiodescription dont la longueur respecte un budget de mots ; statuts validée, modifiée et brouillon IA.</desc>
