<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Wasf — audiodescription assistée par IA, validée par l’humain</title>
  <desc id="desc">Bannière : le nom Wasf (وصف), une scène de médina avec une porte bleue, une ligne d’audiodescription et une forme d’onde où la description est placée dans un silence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D0D"/>
      <stop offset="0.55" stop-color="#1D1D1D"/>
      <stop offset="1" stop-color="#2E2E2E"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#AEAEAE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#AEAEAE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.7">
      <stop offset="0" stop-color="#767676" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#767676" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8D8D8"/>
      <stop offset="0.5" stop-color="#AEAEAE"/>
      <stop offset="1" stop-color="#898989"/>
    </linearGradient>
    <pattern id="khatam" width="72" height="72" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.2">
        <rect x="24" y="24" width="24" height="24"/>
        <rect x="24" y="24" width="24" height="24" transform="rotate(45 36 36)"/>
        <circle cx="36" cy="36" r="4"/>
      </g>
    </pattern>
  </defs>
  <defs>
    <linearGradient id="fadeBannerg" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeBanner"><rect width="1280" height="420" fill="url(#fadeBannerg)"/></mask>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#glowA)"/>
    <rect width="1280" height="420" fill="url(#glowB)"/>
    <rect width="1280" height="420" fill="url(#khatam)" mask="url(#fadeBanner)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.09"/>
  <defs>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8D8D8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9E9E9"/>
      <stop offset="0.6" stop-color="#BFBFBF"/>
      <stop offset="1" stop-color="#999999"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#737373"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <linearGradient id="speech" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C1C1C1"/>
      <stop offset="1" stop-color="#979797"/>
