  <text x="72" y="274" font-family="Gelasio, Georgia, 'Times New Roman', serif" font-size="27" font-weight="500" fill="#E7E7E7">validée
    par <tspan font-weight="800" fill="url(#saffron)">l’humain.</tspan></text>
  <text x="72" y="314" font-family="Figtree, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#A2A2A2">Pour les films
    tunisiens et francophones — en français, en arabe et en darija.</text>
