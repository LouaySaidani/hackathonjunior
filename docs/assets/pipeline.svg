  <title id="title">Pipeline Wasf</title>
  <desc id="desc">Vidéo, extraction audio, transcription et détection des silences, images clés, score ML de chaque créneau, assemblage du contexte, brouillon par Gemini, validation humaine, synthèse vocale, mixage et export.</desc>
