name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: Pytest
        working-directory: backend
        run: pytest -q
      - name: Notebook (DEMO MODE)
        env:
          ASR_PROVIDER: demo
          VLM_PROVIDER: demo
          TTS_PROVIDER: demo
        run: |
          python -m ipykernel install --user --name python3
          python -c "import nbformat; from nbclient import NotebookClient; nb = nbformat.read('notebooks/pipeline_demo.ipynb', as_version=4); NotebookClient(nb, timeout=300, resources={'metadata': {'path': 'notebooks'}}).execute(); print('notebook OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
