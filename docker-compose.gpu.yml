# Optional NVIDIA GPU override (experimental):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
# Requires the NVIDIA Container Toolkit. faster-whisper then runs on CUDA.
services:
  app:
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_MODEL: large-v3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
