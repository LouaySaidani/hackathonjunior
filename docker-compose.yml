# Zero-config: `docker compose up` -> http://localhost:8000 (DEMO MODE if no API key in .env)
services:
  app:
    image: ghcr.io/louaysaidani/hackathonjunior:latest
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - models:/models
    restart: unless-stopped

volumes:
  models:
